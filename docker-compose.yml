services:
    postgres:
        image: postgres:16-alpine
        container_name: digital_commerce_db
        environment:
            POSTGRES_USER: commerce_user
            POSTGRES_PASSWORD: commerce_password
            POSTGRES_DB: digital_commerce
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./migrations:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U commerce_user -d digital_commerce"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: digital_commerce_redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    kafka:
        image: apache/kafka:3.8.0
        container_name: digital_commerce_kafka
        ports:
            - "9092:9092"
        environment:
            # Unique identifier of the node in the cluster
            KAFKA_NODE_ID: 1
            # The node acts as both a message broker and a Raft controller (standalone dev)
            KAFKA_PROCESS_ROLES: broker,controller
            # Configuring ports and protocols for clients and the controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            # Replication factor = 1 for a single local node
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            # Automatic topic creation upon the first message sent
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafkadata:/var/lib/kafka/data

    prometheus:
        image: prom/prometheus:v2.50.0
        container_name: digital_commerce_prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"

    grafana:
        image: grafana/grafana:10.3.3
        container_name: digital_commerce_grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - ./deployments/grafana/provisioning:/etc/grafana/provisioning
            - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards
        depends_on:
            - prometheus

volumes:
    pgdata:
    redisdata:
    kafkadata:
