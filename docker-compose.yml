services:
    # ----------------------------------------------------
    # Infrastructure: Storage, Broker, and Observability
    # ----------------------------------------------------
    postgres:
        image: postgres:16-alpine
        container_name: digital_commerce_db
        environment:
            POSTGRES_USER: commerce_user
            POSTGRES_PASSWORD: commerce_password
            POSTGRES_DB: digital_commerce
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./migrations:/docker-entrypoint-initdb.d
        networks:
            - commerce_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U commerce_user -d digital_commerce"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: digital_commerce_redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        networks:
            - commerce_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    kafka:
        image: apache/kafka:3.8.0
        container_name: digital_commerce_kafka
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            # Two listeners: an internal one for the Docker network (29092) and an external one for the host (9092)
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafkadata:/var/lib/kafka/data
        networks:
            - commerce_network
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ----------------------------------------------------
    # Go Platform Microservices
    # ----------------------------------------------------
    catalog:
        build:
            context: .
            args:
                SERVICE_NAME: catalog
        container_name: digital_commerce_catalog
        environment:
            CATALOG_PORT: ":8081"
            CATALOG_GRPC_PORT: ":50051"
            DATABASE_URL: "postgres://commerce_user:commerce_password@postgres:5432/digital_commerce?sslmode=disable"
            REDIS_ADDR: "redis:6379"
        ports:
            - "8081:8081"
            - "50051:50051"
        networks:
            - commerce_network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
            interval: 5s
            timeout: 3s
            retries: 5

    order:
        build:
            context: .
            args:
                SERVICE_NAME: order
        container_name: digital_commerce_order
        environment:
            ORDER_PORT: ":8082"
            CATALOG_GRPC_ADDR: "catalog:50051"
            DATABASE_URL: "postgres://commerce_user:commerce_password@postgres:5432/digital_commerce?sslmode=disable"
            KAFKA_BROKERS: "kafka:29092"
        ports:
            - "8082:8082"
        networks:
            - commerce_network
        depends_on:
            postgres:
                condition: service_healthy
            catalog:
                condition: service_healthy
            kafka:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
            interval: 5s
            timeout: 3s
            retries: 5

    gateway:
        build:
            context: .
            args:
                SERVICE_NAME: gateway
        container_name: digital_commerce_gateway
        environment:
            GATEWAY_PORT: ":8080"
            CATALOG_SERVICE_URL: "http://catalog:8081"
            ORDER_SERVICE_URL: "http://order:8082"
            REDIS_ADDR: "redis:6379"
        ports:
            - "8080:8080"
        networks:
            - commerce_network
        depends_on:
            catalog:
                condition: service_healthy
            order:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
            interval: 5s
            timeout: 3s
            retries: 5

    notification:
        build:
            context: .
            args:
                SERVICE_NAME: notification
        container_name: digital_commerce_notification
        environment:
            KAFKA_BROKERS: "kafka:29092"
        networks:
            - commerce_network
        depends_on:
            kafka:
                condition: service_healthy

    analytics:
        build:
            context: .
            args:
                SERVICE_NAME: analytics
        container_name: digital_commerce_analytics
        environment:
            KAFKA_BROKERS: "kafka:29092"
        networks:
            - commerce_network
        depends_on:
            kafka:
                condition: service_healthy

    # ----------------------------------------------------
    # Monitoring and visualization
    # ----------------------------------------------------
    prometheus:
        image: prom/prometheus:v2.50.0
        container_name: digital_commerce_prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            - commerce_network
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
        depends_on:
            - gateway
            - order

    grafana:
        image: grafana/grafana:10.3.3
        container_name: digital_commerce_grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - ./deployments/grafana/provisioning:/etc/grafana/provisioning
            - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards
        networks:
            - commerce_network
        depends_on:
            - prometheus

volumes:
    pgdata:
    redisdata:
    kafkadata:

networks:
    commerce_network:
        driver: bridge