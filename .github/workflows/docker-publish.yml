name: Build & Publish Docker Images

  on:
    push:
      branches: [ main, master ]
      tags: [ 'v*.*.*' ]
    pull_request:
      branches: [ main, master ]

  concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

  permissions:
    contents: read
    packages: write

  jobs:
    build-and-push:
      name: Build & Push Service Image
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          service:
            - name: gateway
              image: digital-commerce-gateway
            - name: catalog
              image: digital-commerce-catalog
            - name: order
              image: digital-commerce-order
            - name: notification
              image: digital-commerce-notification
            - name: analytics
              image: digital-commerce-analytics

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extract Docker metadata (tags, labels)
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}/${{ matrix.service.image }}
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short,prefix=sha-
              type=ref,event=tag

        - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            build-args: |
              SERVICE_NAME=${{ matrix.service.name }}
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha,scope=${{ matrix.service.name }}
            cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}