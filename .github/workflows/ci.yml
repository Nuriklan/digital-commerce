name: CI Pipeline

  on:
    push:
      branches: [ main, master ]
    pull_request:
      branches: [ main, master ]

  concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    # 1. Static code analysis
    lint:
      name: Code Linting
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Go environment
          uses: actions/setup-go@v5
          with:
            go-version-file: 'go.mod'
            cache: true

        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: v1.64.5
            args: --timeout=5m

    # 2. Unit and integration testing
    test:
      name: Unit & Race Tests
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Go environment
          uses: actions/setup-go@v5
          with:
            go-version-file: 'go.mod'
            cache: true

        - name: Run tests with race detector and coverage
          run: |
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

        - name: Check test coverage summary
          run: |
            go tool cover -func=coverage.out | tail -n 1

    # 3. Dependency vulnerability audit
    security:
      name: Security Vulnerability Scan
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Go environment
          uses: actions/setup-go@v5
          with:
            go-version-file: 'go.mod'
            cache: true

        - name: Run govulncheck
          uses: golang/govulncheck-action@v1
          with:
            go-version-file: 'go.mod'

    # 4. Verifying the compilability of all microservices
    build-check:
      name: Binary Compile Check
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Go environment
          uses: actions/setup-go@v5
          with:
            go-version-file: 'go.mod'
            cache: true

        - name: Compile all services to /dev/null
          run: |
            go build -v -o /dev/null ./cmd/gateway
            go build -v -o /dev/null ./cmd/catalog
            go build -v -o /dev/null ./cmd/order
            go build -v -o /dev/null ./cmd/notification
            go build -v -o /dev/null ./cmd/analytics