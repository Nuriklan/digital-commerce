apiVersion: v1
  kind: ConfigMap
  metadata:
    name: commerce-config
    namespace: digital-commerce
    labels:
      app.kubernetes.io/part-of: digital-commerce
  data:
    # Infrastructure dependencies (intra-cluster DNS names or external services)
    POSTGRES_HOST: "postgres-service.digital-commerce.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "commerce_db"
    POSTGRES_USER: "postgres"
    POSTGRES_SSLMODE: "disable"

    REDIS_ADDR: "redis-service.digital-commerce.svc.cluster.local:6379"

    KAFKA_BROKERS: "kafka-service.digital-commerce.svc.cluster.local:9092"

    # Inter-service URLs for API Gateway and clients
    CATALOG_SERVICE_URL: "http://catalog-service.digital-commerce.svc.cluster.local:8081"
    ORDER_SERVICE_URL: "http://order-service.digital-commerce.svc.cluster.local:8082"
    CATALOG_GRPC_ADDR: "catalog-service.digital-commerce.svc.cluster.local:50051"

    # Service ports
    GATEWAY_PORT: ":8080"
    CATALOG_PORT: ":8081"
    ORDER_PORT: ":8082"
  ---
  apiVersion: v1
  kind: Secret
  metadata:
    name: commerce-secrets
    namespace: digital-commerce
    labels:
      app.kubernetes.io/part-of: digital-commerce
  type: Opaque
  stringData:
    # Sensitive data (stringData is converted to base64 by K8s upon saving)
    POSTGRES_PASSWORD: "secretpassword"
    REDIS_PASSWORD: ""