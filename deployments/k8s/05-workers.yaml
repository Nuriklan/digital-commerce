apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: notification-service
    namespace: digital-commerce
    labels:
      app: notification-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    selector:
      matchLabels:
        app: notification-service
    template:
      metadata:
        labels:
          app: notification-service
      spec:
        terminationGracePeriodSeconds: 30
        containers:
          - name: notification
            image: digital-commerce-notification:latest
            imagePullPolicy: IfNotPresent
            env:
              - name: KAFKA_BROKERS
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: KAFKA_BROKERS
            resources:
              requests:
                cpu: 30m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 64Mi
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: analytics-service
    namespace: digital-commerce
    labels:
      app: analytics-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    selector:
      matchLabels:
        app: analytics-service
    template:
      metadata:
        labels:
          app: analytics-service
      spec:
        terminationGracePeriodSeconds: 30
        containers:
          - name: analytics
            image: digital-commerce-analytics:latest
            imagePullPolicy: IfNotPresent
            env:
              - name: KAFKA_BROKERS
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: KAFKA_BROKERS
            resources:
              requests:
                cpu: 30m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 64Mi