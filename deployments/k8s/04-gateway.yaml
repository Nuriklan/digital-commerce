apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: gateway-service
    namespace: digital-commerce
    labels:
      app: gateway-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    selector:
      matchLabels:
        app: gateway-service
    template:
      metadata:
        labels:
          app: gateway-service
      spec:
        containers:
          - name: gateway
            image: digital-commerce-gateway:latest
            imagePullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8080
            env:
              - name: GATEWAY_PORT
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: GATEWAY_PORT
              - name: CATALOG_SERVICE_URL
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: CATALOG_SERVICE_URL
              - name: ORDER_SERVICE_URL
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: ORDER_SERVICE_URL
              - name: REDIS_ADDR
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: REDIS_ADDR
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: commerce-secrets
                    key: REDIS_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
            livenessProbe:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 2
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 2
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: gateway-service
    namespace: digital-commerce
    labels:
      app: gateway-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    type: ClusterIP
    selector:
      app: gateway-service
    ports:
      - name: http
        port: 8080
        targetPort: 8080
        protocol: TCP