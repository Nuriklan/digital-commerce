apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: catalog-service
    namespace: digital-commerce
    labels:
      app: catalog-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    selector:
      matchLabels:
        app: catalog-service
    template:
      metadata:
        labels:
          app: catalog-service
      spec:
        containers:
          - name: catalog
            image: digital-commerce-catalog:latest
            imagePullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8081
              - name: grpc
                containerPort: 50051
            env:
              - name: CATALOG_PORT
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: CATALOG_PORT
              - name: CATALOG_GRPC_PORT
                value: ":50051"
              - name: POSTGRES_HOST
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_HOST
              - name: POSTGRES_PORT
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_PORT
              - name: POSTGRES_DB
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_DB
              - name: POSTGRES_USER
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_USER
              - name: POSTGRES_SSLMODE
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_SSLMODE
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: commerce-secrets
                    key: POSTGRES_PASSWORD
              - name: REDIS_ADDR
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: REDIS_ADDR
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: commerce-secrets
                    key: REDIS_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
            livenessProbe:
              httpGet:
                path: /health
                port: 8081
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: 8081
              initialDelaySeconds: 2
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 2
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: catalog-service
    namespace: digital-commerce
    labels:
      app: catalog-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    type: ClusterIP
    selector:
      app: catalog-service
    ports:
      - name: http
        port: 8081
        targetPort: 8081
        protocol: TCP
      - name: grpc
        port: 50051
        targetPort: 50051
        protocol: TCP