apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: order-service
    namespace: digital-commerce
    labels:
      app: order-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    selector:
      matchLabels:
        app: order-service
    template:
      metadata:
        labels:
          app: order-service
      spec:
        containers:
          - name: order
            image: digital-commerce-order:latest
            imagePullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8082
            env:
              - name: ORDER_PORT
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: ORDER_PORT
              - name: POSTGRES_HOST
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_HOST
              - name: POSTGRES_PORT
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_PORT
              - name: POSTGRES_DB
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_DB
              - name: POSTGRES_USER
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_USER
              - name: POSTGRES_SSLMODE
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: POSTGRES_SSLMODE
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: commerce-secrets
                    key: POSTGRES_PASSWORD
              - name: KAFKA_BROKERS
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: KAFKA_BROKERS
              - name: CATALOG_GRPC_ADDR
                valueFrom:
                  configMapKeyRef:
                    name: commerce-config
                    key: CATALOG_GRPC_ADDR
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
            livenessProbe:
              httpGet:
                path: /health
                port: 8082
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: 8082
              initialDelaySeconds: 2
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 2
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: order-service
    namespace: digital-commerce
    labels:
      app: order-service
      app.kubernetes.io/part-of: digital-commerce
  spec:
    type: ClusterIP
    selector:
      app: order-service
    ports:
      - name: http
        port: 8082
        targetPort: 8082
        protocol: TCP