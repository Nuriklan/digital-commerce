global:
      scrape_interval: 5s
      evaluation_interval: 5s

scrape_configs:
    # Prometheus self-monitoring
    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]

    # Scraping API Gateway within a Docker network
    - job_name: "gateway"
      metrics_path: "/metrics"
      static_configs:
          - targets: ["gateway:8080"]
            labels:
                service: "gateway"

    # Scraping the Order Service within a Docker network
    - job_name: "order-service"
      metrics_path: "/metrics"
      static_configs:
          - targets: ["order:8082"]
            labels:
                service: "order-service"