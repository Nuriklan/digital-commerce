global:
    scrape_interval: 5s
    evaluation_interval: 5s

  scrape_configs:
    - job_name: "prometheus"
      static_configs:
        - targets: ["localhost:9090"]

    - job_name: "gateway"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["host.docker.internal:8080"]
          labels:
            service: "gateway"

    # Скрейпинг Order Service
    - job_name: "order-service"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["host.docker.internal:8082"]
          labels:
            service: "order-service"